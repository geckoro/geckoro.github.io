<!doctype html>
<html lang="ro">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz plante</title>

  <style>
    :root {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0c10;
      color: #e8e8ea;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: #12141a;
      border: 1px solid #262a35;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .row>* {
      flex: 1 1 auto;
      min-width: 220px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }

    .muted {
      color: #a8adbd;
      font-size: 13px;
      line-height: 1.45;
    }

    .small {
      font-size: 12px;
      color: #a8adbd;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      background: #171a22;
      border: 1px solid #2a2f3d;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      color: #d7d9e0;
    }

    .btn {
      background: #2a7fff;
      border: 0;
      color: white;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 650;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn.secondary {
      background: #212635;
    }

    .btn.danger {
      background: #e24a4a;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    label.opt {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #2a2f3d;
      background: #141824;
      cursor: pointer;
    }

    label.opt input[type="radio"] {
      width: 20px;
      height: 20px;
      accent-color: #2a7fff;
    }

    .letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #1b2030;
      border: 1px solid #2a2f3d;
      color: #cfe1ff;
      font-weight: 800;
    }

    .feedback {
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
    }

    .good {
      background: rgba(47, 125, 79, .2);
    }

    .bad {
      background: rgba(184, 75, 75, .2);
    }

    .preview-image {
      width: 300px;
      max-width: 100%;
      cursor: pointer;
      border-radius: 8px;
    }

    /* Modal */
    .image-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      z-index: 9999;
    }

    .image-modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Horizontal scrolling container */
    .image-scroll-container {
      width: 100vw;
      height: 30vh;

      overflow-x: auto;
      overflow-y: hidden;

      -webkit-overflow-scrolling: touch;

      display: flex;
      align-items: center;

      touch-action: pan-x;
    }

    .image-scroll-container img {
      height: 30vh;
      width: auto;
      max-width: none;

      user-select: none;
      -webkit-user-drag: none;

      margin: auto;
    }

    .close-btn {
      position: fixed;
      top: 15px;
      right: 20px;
      color: white;
      font-size: 32px;
      cursor: pointer;
      z-index: 10000;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="card">
      <h1>Quiz plante 🌱</h1>

      <div class="row">
        <input id="fileInput" type="file" accept=".txt">
        <button class="btn" id="startBtn" disabled>Start</button>
        <select id="modeSelect" class="btn secondary">
          <option value="normal">Mod NORMAL</option>
          <option value="hard">Mod DIFICIL</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="stats">
        <div class="pill">Rămase: <b id="remaining">0</b></div>
        <div class="pill">Corecte: <b id="correctCount">0</b></div>
        <div class="pill">Greșite: <b id="wrongCount">0</b></div>
      </div>
    </div>

    <div class="card" id="quizCard" style="display:none; margin-top:12px;">
      <div class="small">Întrebarea <b id="qIndex">0</b> / <b id="qTotal">0</b></div>

      <img id="img" class="preview-image">

      <div id="answers" class="answers"></div>

      <div class="row" style="margin-top:12px;">
        <button class="btn" id="checkBtn">Verifică</button>
        <button class="btn secondary" id="nextBtn" disabled>Next</button>
      </div>

      <div id="feedback" class="feedback" style="display:none;"></div>
    </div>

  </div>

  <!-- ZOOM MODAL -->
  <div class="image-modal" id="modal">
    <div class="close-btn" id="closeBtn">&times;</div>

    <div class="image-scroll-container" id="scrollContainer">
      <img id="modalImage" />
    </div>
  </div>

  <script>
    let q = [],
      i = 0,
      correct = 0,
      wrong = 0;
    let mode = "normal";

    fileInput.onchange = () => startBtn.disabled = !fileInput.files.length;

    startBtn.onclick = () => {
      mode = modeSelect.value;

      const r = new FileReader();
      r.onload = e => {
        q = parse(e.target.result);
        shuffle(q);
        quizCard.style.display = "block";
        show();
      };
      r.readAsText(fileInput.files[0]);
    };

    function parse(t) {
      return t.trim().split(/\n\s*\n/).map((b, idx) => {
        let lines = b.split("\n").filter(x => x.trim());

        let answers = [];
        let correctIndex = -1;

        lines.slice(1).forEach((l, i) => {
          let isCorrect = l[0] === l[0].toUpperCase();

          let full = l.substring(3).trim();

          // separăm textul
          let outside = full;
          let inside = "";

          let match = full.match(/^(.*?)\s*\((.*?)\)$/);

          if (match) {
            outside = match[1].trim();
            inside = match[2].trim();
          }

          answers.push({
            normal: full,
            hard: inside || outside, // fallback dacă nu există paranteză
            correct: isCorrect
          });
        });

        correctIndex = answers.findIndex(a => a.correct);

        return {
          img: `../quiz_images/${idx+1}.jpg`,
          answers,
          correctIndex
        };
      });
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function show() {
      let cur = q[i];

      img.src = cur.img;
      answers.innerHTML = "";

      cur.answers.forEach((x, j) => {
        let text = (mode === "hard") ? x.hard : x.normal;

        answers.innerHTML += `
      <label class="opt">
        <input type="radio" name="a" value="${j}">
        <div class="letter">${String.fromCharCode(65+j)}</div>
        <div>${text}</div>
      </label>`;
      });

      qIndex.textContent = i + 1;
      qTotal.textContent = q.length;
      remaining.textContent = q.length - i;

      feedback.style.display = "none";
      nextBtn.disabled = true;
      checkBtn.disabled = false;
    }

    checkBtn.onclick = () => {
      let sel = document.querySelector('input[name="a"]:checked');
      if (!sel) return;

      // 🔒 BLOCARE răspunsuri
      document.querySelectorAll('input[name="a"]').forEach(el => el.disabled = true);
      console.log(q[i]);
      if (+sel.value === q[i].correctIndex) {
        correct++;
        feedback.className = "feedback good";
        feedback.innerHTML = "Corect!";
      } else {
        wrong++;
        feedback.className = "feedback bad";
        feedback.innerHTML = "Greșit, răspuns corect: " + "<b>" + q[i].answers.find(item => item.correct).normal +
          "</b>";
      }

      correctCount.textContent = correct;
      wrongCount.textContent = wrong;

      feedback.style.display = "block";
      nextBtn.disabled = false;
      checkBtn.disabled = true;
    };

    nextBtn.onclick = () => {
      i++;
      if (i < q.length) show();
      else alert("Final!");
    };

    // Zoom
    const preview = document.getElementById('img');
    const modal = document.getElementById('modal');
    const closeBtn = document.getElementById('closeBtn');
    const modalImg = document.getElementById('modalImg');

    preview.addEventListener('click', () => {
      modalImage.src = preview.src;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    });

    closeBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }
    // End zoom
  </script>

</body>

</html>
